# LTM100 example config: synthetic dataset + MemMachine REST backend.
#
# Fast load testing with no external data download. Run with:
#   ltm100 run --config examples/synthetic.yaml \
#       --scenario chat-replay --users 20 --duration 30 --seed 0

dataset:
  name: synthetic
  memories_per_user: 100
  content_chars: 200
  # Optional: write metadata.category (cat_0..cat_{N-1}) so --filter can select
  # ~1/N of the data. Uncomment to use, e.g. `--filter metadata.category=cat_3`.
  # categories: 10

backend:
  name: memmachine
  base_url: http://localhost:8080
  org_prefix: ltm100
  timeout: 60.0
  add_batch_size: 50
  # Optional: retry connection-level failures only (HTTP errors are never
  # retried, so the error rate stays accurate). Default 0.
  # retries: 3
