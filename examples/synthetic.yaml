# LTM100 example config: synthetic dataset + MemMachine REST backend.
#
# Fast load testing with no external data download. Run with:
#   ltm100 run --config examples/synthetic.yaml \
#       --scenario add-search-mixed --users 20 --duration 30 --seed 0

dataset:
  name: synthetic
  memories_per_user: 100
  queries_per_user: 5
  content_chars: 200

backend:
  name: memmachine
  base_url: http://localhost:8080
  org_prefix: ltm100
  timeout: 60.0
  add_batch_size: 50
