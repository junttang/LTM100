# LTM100 example config: LongMemEval dataset + MemMachine REST backend.
#
# Copy and edit: fill in base_url. Run with:
#   ltm100 run --config examples/memmachine.yaml \
#       --scenario chat-replay --users 50 --duration 60 --seed 0

dataset:
  name: longmemeval
  # Option A: load from a pre-downloaded local JSON file (no HF download).
  path: ~/longmemeval/longmemeval_s_cleaned.json
  # Option B (comment out `path`): download from HuggingFace instead.
  split: longmemeval_s_cleaned
  length: 100            # cap number of dataset samples (and thus max unique users)

backend:
  name: memmachine
  base_url: http://localhost:8080
  org_prefix: ltm100
  timeout: 60.0
  add_batch_size: 50
