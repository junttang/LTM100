# Chat replay: LongMemEval dataset + MemMachine REST backend.
#
# LongMemEval provides the dialogue turn_stream required by chat-replay.
# Install the dataset extra before using the default Hugging Face source:
#   pip install -e ".[datasets]"
#
# Run with:
#   ltm100 run --config examples/memmachine.yaml \
#       --scenario chat-replay --users 50 --duration 60 --seed 0

dataset:
  name: longmemeval
  # Default: download from Hugging Face. To use a local copy instead,
  # uncomment path; when path is set, it takes precedence over split.
  # path: ~/longmemeval/longmemeval_s_cleaned.json
  split: longmemeval_s_cleaned
  length: 100  # cap dataset samples (users may replicate samples above this)

backend:
  name: memmachine
  base_url: http://localhost:8080
  org_prefix: ltm100
  timeout: 60.0
  add_batch_size: 50
