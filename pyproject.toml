[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ltm100"
version = "0.1.0"
description = "Multi-user load benchmark for Long-Term Memory (LTM) systems."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Junhyuok Park", email = "junhyeok0.park@sk.com" }]
dependencies = [
    "aiohttp>=3.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
datasets = [
    "datasets>=2.14",
    "huggingface_hub>=0.20",
]
dev = [
    "pytest>=7",
    "ruff>=0.4",
]

[project.scripts]
ltm100 = "ltm100.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ltm100*"]

[tool.ruff]
line-length = 88
target-version = "py310"
